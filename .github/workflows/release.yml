name: Build & Release Windows Standalone

on:
  push:
    tags:
      - "v*"
      - "release"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit & safety tests
        env:
          PIRATE_HEADLESS: "1"
        run: |
          python -m py_compile fortnite_farm.py
          python tests\test_pirate_farm.py

      - name: Build standalone Windows EXE (PyInstaller)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin `
            --name "PirateTokenFarm" `
            --icon "assets\icon.ico" `
            --add-data "templates;templates" `
            --add-data "assets;assets" `
            --add-data "fonts;fonts" `
            --hidden-import "PIL._tkinter_finder" `
            fortnite_farm.py

      - name: Package release artifacts & SHA-256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_out | Out-Null
          $exeOut = "release_out\PirateTokenFarm-win64.exe"
          Copy-Item "dist\PirateTokenFarm.exe" $exeOut -Force

          $portDir = "release_out\portable\PirateTokenFarm"
          New-Item -ItemType Directory -Force -Path $portDir | Out-Null
          Copy-Item "dist\PirateTokenFarm.exe" "$portDir\Pirate Token Farm.exe" -Force
          Copy-Item "README.md" "$portDir\README.md" -Force
          Copy-Item "LICENSE" "$portDir\LICENSE" -Force
          Copy-Item "settings.example.json" "$portDir\settings.example.json" -Force

          $zipOut = "release_out\PirateTokenFarm-win64-portable.zip"
          Compress-Archive -Path "$portDir\*" -DestinationPath $zipOut -Force
          Remove-Item "release_out\portable" -Recurse -Force

          Get-ChildItem release_out\* | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 "release_out\SHA256SUMS.txt"
          Get-Content "release_out\SHA256SUMS.txt"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'release' }}
          name: Pirate Token Farm
          make_latest: true
          generate_release_notes: true
          files: |
            release_out/PirateTokenFarm-win64.exe
            release_out/PirateTokenFarm-win64-portable.zip
            release_out/SHA256SUMS.txt
